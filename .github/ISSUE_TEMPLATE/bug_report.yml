name: Bug report
description: Report a reproducible node failure
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include a minimal workflow or exact settings when possible.
    validations:
      required: true
  - type: input
    id: comfy-version
    attributes:
      label: ComfyUI version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full traceback
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed private model files and API keys from the report.
          required: true
